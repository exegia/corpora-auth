name: Publish Release

# Semver release, step 2: runs once a release.yml PR (branch release/v*)
# merges into main. Tags the merge commit, publishes both npm packages to
# GitHub Packages, and creates the GitHub Release. Never pushes to main —
# only pushes a tag and calls the releases/packages APIs — so it needs no
# bypass on the "Protect main branch" ruleset.
on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency: release

jobs:
  publish:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the tag, create the release
      packages: write   # publish to GitHub Packages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
      # node-only, no registry-url: `bun publish` doesn't reliably pick up
      # .npmrc auth (open bug, oven-sh/bun#24124 — `npm whoami` succeeds
      # right before `bun publish` still fails "missing authentication").
      # Project-level .npmrc doesn't fix it either (confirmed in that
      # thread) — bun's global-config lookup uses $XDG_CONFIG_HOME/.npmrc,
      # which isn't $HOME on GitHub Actions runners, so a normally-placed
      # .npmrc is invisible to it. Each publish step below points
      # XDG_CONFIG_HOME at $HOME and writes .npmrc there instead.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./guest-js/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Tag release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "v${{ steps.version.outputs.version }}"
          git push origin "refs/tags/v${{ steps.version.outputs.version }}"

      # bun publish strips workspace:* protocols but (unlike pnpm) does not
      # apply publishConfig field overrides (main/types/exports), which the
      # ui package relies on to point consumers at dist/ instead of src/.
      - name: Apply publishConfig field overrides
        working-directory: ui
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const { registry, ...overrides } = pkg.publishConfig ?? {};
            Object.assign(pkg, overrides);
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '

      - name: Publish @exegia/plugin-supabase-auth
        working-directory: guest-js
        run: |
          export XDG_CONFIG_HOME="$HOME"
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > "$XDG_CONFIG_HOME/.npmrc"
          echo "@exegia:registry=https://npm.pkg.github.com/" >> "$XDG_CONFIG_HOME/.npmrc"
          bun publish
          rm -f "$XDG_CONFIG_HOME/.npmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish @exegia/auth-ui
        working-directory: ui
        run: |
          export XDG_CONFIG_HOME="$HOME"
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > "$XDG_CONFIG_HOME/.npmrc"
          echo "@exegia:registry=https://npm.pkg.github.com/" >> "$XDG_CONFIG_HOME/.npmrc"
          bun publish
          rm -f "$XDG_CONFIG_HOME/.npmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes
