name: Publish Release

# Semver release, step 2: runs once a release.yml PR (branch release/v*)
# merges into main. Tags the merge commit, publishes both npm packages to
# GitHub Packages, creates the GitHub Release, and retires the vX.Y.Z-rc.*
# staging tag stage-tag.yml created on next. Never pushes to main — only
# pushes/deletes tags and calls the releases/packages APIs — so it needs no
# bypass on the "Protect main branch" ruleset.
on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency: release

jobs:
  publish:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the tag, create the release
      packages: write   # publish to GitHub Packages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
      # node-only, no registry-url: `bun publish` doesn't reliably pick up
      # .npmrc auth (open bug, oven-sh/bun#24124 — `npm whoami` succeeds
      # right before `bun publish` still fails "missing authentication"),
      # and a project-level .npmrc alone didn't fix it either (tried in a
      # prior version of this workflow, still failed on v0.4.0). See the
      # publish steps below for the two-pronged workaround.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./guest-js/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Tag release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "v${{ steps.version.outputs.version }}"
          git push origin "refs/tags/v${{ steps.version.outputs.version }}"

      # bun publish strips workspace:* protocols but (unlike pnpm) does not
      # apply publishConfig field overrides (main/types/exports), which the
      # ui package relies on to point consumers at dist/ instead of src/.
      - name: Apply publishConfig field overrides
        working-directory: ui
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const { registry, ...overrides } = pkg.publishConfig ?? {};
            Object.assign(pkg, overrides);
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '

      # Verified locally (2026-07-28, bun 1.3.14): `bun publish` with a
      # project-level .npmrc gives the same client-side "missing
      # authentication" failure this workflow hit on v0.4.0 — no network
      # call is even attempted. With XDG_CONFIG_HOME=$HOME and .npmrc
      # written there instead, bun sends the token and gets a real server
      # response (401 for a bad token), confirming this placement is what
      # bun's global-config lookup actually reads.
      - name: Publish @exegia/plugin-supabase-auth
        working-directory: guest-js
        run: |
          export XDG_CONFIG_HOME="$HOME"
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > "$XDG_CONFIG_HOME/.npmrc"
          echo "@exegia:registry=https://npm.pkg.github.com/" >> "$XDG_CONFIG_HOME/.npmrc"
          bun publish
          rm -f "$XDG_CONFIG_HOME/.npmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish @exegia/auth-ui
        working-directory: ui
        run: |
          export XDG_CONFIG_HOME="$HOME"
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > "$XDG_CONFIG_HOME/.npmrc"
          echo "@exegia:registry=https://npm.pkg.github.com/" >> "$XDG_CONFIG_HOME/.npmrc"
          bun publish
          rm -f "$XDG_CONFIG_HOME/.npmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes

      # Closes the staging cycle: stage-tag.yml and release.yml treat "does a
      # vX.Y.Z-rc.* tag exist" as the sole open-train signal (an ancestry
      # check isn't reliable here since main allows squash merges). This
      # delete IS the gate-closer, not a cleanup nicety -- if it silently
      # failed, every future merge into next would think this train is still
      # open and never mint a new one. Fail loudly instead.
      - name: Retire the staging tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAGS=$(git tag --list "v${VERSION}-rc.*")
          if [ -z "$TAGS" ]; then
            echo "::error::No v${VERSION}-rc.* staging tag found to retire. The next-side train gate will not reopen correctly -- investigate before merging further release PRs." >&2
            exit 1
          fi
          for t in $TAGS; do
            git push origin --delete "refs/tags/$t"
          done
