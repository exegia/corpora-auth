name: Publish

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  npm-github-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @exegia/plugin-supabase-auth build
      - name: Publish @exegia/plugin-supabase-auth
        working-directory: guest-js
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
