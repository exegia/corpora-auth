name: CI

on:
  push:
    branches: [main, next, dev]
  pull_request:

# Least privilege for every job below: CI only ever reads the checkout.
# Set at workflow level so new jobs inherit it rather than each needing
# its own block (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # src/ceremony/windows.rs is cfg(windows) — the ubuntu job never compiles it,
  # and neither does a macOS dev host. Without this job the Windows built-in
  # ceremony (feature 004 T025) reaches no compiler at all.
  # Compilation + platform-agnostic tests only: webauthn.dll and the Windows
  # Hello prompt still need the manual smoke checklist on real hardware.
  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # src/ceremony/macos.rs is cfg(target_os = "macos") — same gap as the Windows
  # job above, but lower-risk because it does compile on a macOS dev host. This
  # job stops that from depending on who happens to be building.
  # Compilation + platform-agnostic tests only: the ASAuthorization prompt needs
  # Associated Domains, a provisioning profile, and a human at a Touch ID Mac —
  # that stays the manual smoke checklist (T026).
  # NOTE: macOS runners bill at 10x (Windows 2x, Linux 1x).
  rust-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reads the bun version from the root package.json "packageManager" field.
      - uses: oven-sh/setup-bun@v2
      # Some tooling (vitest, tsc shims) still spawns `node` directly.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run --filter @exegia/auth-ui test

  # SC-006: full auth lifecycle against a real local Supabase stack.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase stack
        run: |
          supabase init --force
          supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector
      - name: Run lifecycle E2E
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          SUPABASE_E2E_URL="$API_URL" SUPABASE_E2E_KEY="$ANON_KEY" \
            cargo test --test e2e_lifecycle -- --ignored --nocapture
