name: Release

# One-click semver release: bumps versions in lockstep, tags, publishes both
# npm packages to GitHub Packages, and creates a GitHub Release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump"
        required: true
        type: choice
        options: [patch, minor, major]
        default: minor

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push version commit + tag, create the release
      packages: write   # publish to GitHub Packages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # Reads the bun version from the root package.json "packageManager" field.
      - uses: oven-sh/setup-bun@v2
      # Still needed: writes the .npmrc (registry + auth token) that
      # `bun publish` reads, and provides `node` for the scripts below.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
      - run: bun install --frozen-lockfile

      # Gate: never release red. Build first — the UI tests need the
      # bindings package's dist to exist for module resolution.
      - run: bun run build
      - run: bun run --filter @exegia/auth-ui test

      - name: Bump versions in lockstep
        id: bump
        run: |
          # --no-workspaces-update: @exegia/auth-ui depends on the bindings via
          # `workspace:*`, and npm's post-version dependency pass does not
          # understand that protocol — it aborts with EUNSUPPORTEDPROTOCOL.
          # Only the version field needs changing here; bun install owns the
          # workspace linking.
          (cd guest-js && npm version ${{ inputs.bump }} --no-git-tag-version --no-workspaces-update)
          (cd ui && npm version ${{ inputs.bump }} --no-git-tag-version --no-workspaces-update)
          VERSION=$(node -p "require('./guest-js/package.json').version")
          # Keep the crate version aligned (first `version =` in [package]).
          python3 -c "import re,sys; p='Cargo.toml'; s=open(p).read(); open(p,'w').write(re.sub(r'^version = \".*\"$', 'version = \"'+sys.argv[1]+'\"', s, count=1, flags=re.M))" "$VERSION"
          cargo update --workspace --quiet || true   # refresh Cargo.lock version entry
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): v${{ steps.bump.outputs.version }}"
          git tag -a "v${{ steps.bump.outputs.version }}" -m "v${{ steps.bump.outputs.version }}"
          git push origin main "refs/tags/v${{ steps.bump.outputs.version }}"

      # bun publish strips workspace:* protocols but (unlike pnpm) does not
      # apply publishConfig field overrides (main/types/exports), which the
      # ui package relies on to point consumers at dist/ instead of src/.
      # Apply them manually after the release commit so they never land in git.
      - name: Apply publishConfig field overrides
        working-directory: ui
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const { registry, ...overrides } = pkg.publishConfig ?? {};
            Object.assign(pkg, overrides);
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '

      - name: Publish @exegia/plugin-supabase-auth
        working-directory: guest-js
        run: bun publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish @exegia/auth-ui
        working-directory: ui
        run: bun publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.bump.outputs.version }}" \
            --title "v${{ steps.bump.outputs.version }}" \
            --generate-notes
