name: Release

# Semver release, step 1: bumps versions in lockstep and opens a PR against
# main with the bump commit. The "Protect main branch" ruleset requires PRs
# with review + status checks, so this workflow no longer pushes to main
# directly — see publish-release.yml for what runs after the PR merges.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump"
        required: true
        type: choice
        options: [patch, minor, major]
        default: minor

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the release/* branch
      pull-requests: write   # open the release PR
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # Reads the bun version from the root package.json "packageManager" field.
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile

      # Gate: never open a release PR red.
      - run: bun run build
      - run: bun run --filter @exegia/auth-ui test

      - name: Bump versions in lockstep
        id: bump
        run: |
          # --no-workspaces-update: @exegia/auth-ui depends on the bindings via
          # `workspace:*`, and npm's post-version dependency pass does not
          # understand that protocol — it aborts with EUNSUPPORTEDPROTOCOL.
          # Only the version field needs changing here; bun install owns the
          # workspace linking.
          (cd guest-js && npm version ${{ inputs.bump }} --no-git-tag-version --no-workspaces-update)
          (cd ui && npm version ${{ inputs.bump }} --no-git-tag-version --no-workspaces-update)
          VERSION=$(node -p "require('./guest-js/package.json').version")
          # Keep the crate version aligned (first `version =` in [package]).
          python3 -c "import re,sys; p='Cargo.toml'; s=open(p).read(); open(p,'w').write(re.sub(r'^version = \".*\"$', 'version = \"'+sys.argv[1]+'\"', s, count=1, flags=re.M))" "$VERSION"
          cargo update --workspace --quiet || true   # refresh Cargo.lock version entry
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # bun.lock pins each workspace member's own version (e.g. guest-js ->
      # "0.2.2"), and `bun publish` resolves `workspace:*` deps against that
      # pinned version, not the live package.json. Without this, publishing
      # ui after the bump above ships a stale `@exegia/plugin-supabase-auth`
      # dependency version (confirmed: v0.5.0 shipped pinned to 0.2.2).
      # Verified locally: a plain `bun install` over an existing bun.lock
      # does NOT refresh a workspace member's pinned version (the
      # `workspace:*` specifier string is unchanged, so bun skips
      # re-resolving it) — the lockfile must be deleted and regenerated.
      - name: Refresh bun.lock to pick up the bumped versions
        run: rm -f bun.lock && bun install

      - name: Commit and push release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/v${{ steps.bump.outputs.version }}"
          git add -A
          git commit -m "chore(release): v${{ steps.bump.outputs.version }}"
          git push origin "release/v${{ steps.bump.outputs.version }}"

      - name: Open release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "release/v${{ steps.bump.outputs.version }}" \
            --title "chore(release): v${{ steps.bump.outputs.version }}" \
            --body "Automated version bump (${{ inputs.bump }}) to v${{ steps.bump.outputs.version }}. Merging this PR triggers \`publish-release.yml\`, which tags, publishes both npm packages, and creates the GitHub Release."
