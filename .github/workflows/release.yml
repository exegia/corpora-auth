# A release PR landed on main: publish it, then open the next release branch.
#
# One version, three artifacts:
#
#   tauri-plugin-supabase-auth    -> crates.io        (skipped until CARGO_REGISTRY_TOKEN exists)
#   @exegia/plugin-supabase-auth  -> GitHub Packages  (GITHUB_TOKEN)
#                                 -> npmjs.org        (NPM_TOKEN)
#   @exegia/use-auth              -> npmjs.org        (NPM_TOKEN)
#
# The bindings ship to both registries from one step, because @exegia/use-auth
# is public on npmjs and pins them exactly — a consumer mapping @exegia at
# npmjs with no token has to resolve both. `publish-verify` then asserts the
# two registries agree, so parity is CI's job and not a human's.
#
# Nothing is re-tested or re-verified here — the exact tree being published
# already passed `check` and `package` on the release PR. The build step exists
# only because publishing needs the two dist/ directories, and it builds those
# alone: this job has no Rust toolchain deps installed.
#
# Every publish target is idempotent, so re-running a partly-failed release is
# safe: what is already on a registry is skipped, not re-pushed. Publishing runs
# before tagging on purpose — a failed publish then leaves no tag pointing at a
# version nobody can install.
#
# No npm provenance: `bun publish` has no equivalent of `npm publish
# --provenance`, and bun is what correctly strips the `workspace:*` dependency
# @exegia/use-auth has on the bindings.
#
# The dispatch is the bootstrap: it opens a release branch without a preceding
# publish, which is how the first one (and any manual re-cut) gets created.
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Bump for the next release branch
        default: minor
        type: choice
        options: [major, minor, patch]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  INSTALL_FLAGS: --frozen-lockfile

jobs:
  publish:
    name: publish
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && startsWith(github.head_ref, 'release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the GitHub Release
      packages: write # publish the bindings to GitHub Packages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # The two npm dist/ directories and nothing else. NOT `make build`, which
      # also runs build-plugin (`cargo publish --dry-run`) — that compiles the
      # crate, so it needs the webkit/glib system packages `pr.yml`'s `check`
      # job installs and this one deliberately does not. The dry-run already
      # ran there, against this exact tree, on the release PR.
      - run: make install build-bindings build-ui

      # Two registries, never mapped at the same time: each publish owns
      # $HOME/.npmrc for its own duration and hands it back. See
      # scripts/publish.sh for why that file, and why not a project-level one.
      # This step needs both tokens because it makes both publishes — that is
      # what keeps the two registries on the same version.
      - name: Publish @exegia/plugin-supabase-auth
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: make publish-bindings

      - name: Publish @exegia/use-auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: make publish-ui

      # Both registries carry this version, and the hooks install from public
      # npm with no credentials at all. Reads only — it publishes nothing, and
      # it gates the tag: a version nobody can install should not get one.
      - name: Verify registry parity
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make publish-verify

      # The crate is not on crates.io yet. Without the token this writes a note
      # to the job summary and succeeds — a permanently-red release step would
      # only train everyone to ignore it.
      - name: Publish tauri-plugin-supabase-auth
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: make publish-crate

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: make release-tag

      - name: Delete the release branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
        run: make release-delete

  next-release:
    name: next-release
    needs: [publish]
    # `publish` is skipped on a manual dispatch, which is exactly the bootstrap
    # case — so run whenever it did not actually fail.
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      # Full history and tags: `version.sh next` reads the newest vX.Y.Z tag.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      # The bump regenerates bun.lock, which means a real `bun install`.
      - uses: ./.github/actions/setup

      - name: Open the next release branch
        env:
          BUMP: ${{ inputs.bump || 'minor' }}
        run: |
          git config user.name  "corpora-automation[bot]"
          git config user.email "corpora-automation[bot]@users.noreply.github.com"
          make release-branch
