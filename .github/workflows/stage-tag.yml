name: Stage Release Train

# Runs once per PR merged into `next`. `next` is the staging branch: every
# merge either opens a new release train (a `vX.Y.Z-rc.1` tag) or, if a train
# is already open and unpromoted, just labels the PR into it. No build, no
# publish here -- that only ever happens on `main`, via publish-release.yml.
on:
  pull_request:
    types: [closed]
    branches: [next]

# Two PRs merging into next in close succession must not both decide "no open
# train" and mint two tags. Serialize; never cancel a run that's already
# deciding/tagging.
concurrency:
  group: next-release-train
  cancel-in-progress: false

permissions:
  contents: write        # create/push the staging tag
  pull-requests: write    # label the merged PR

jobs:
  stage:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: next
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch main
        run: git fetch origin main --tags --quiet

      - name: Determine release train state
        id: train
        run: |
          set -euo pipefail

          # Last version actually published on main (real tags only, never -rc).
          # -v -- '-rc' matters: the glob 'v[0-9]*.[0-9]*.[0-9]*' also matches
          # 'v0.6.0-rc.1' (trailing * eats the suffix).
          LAST_VERSION=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --merged origin/main | grep -v -- '-rc' | sort -V | tail -n1 | sed 's/^v//')
          LAST_VERSION="${LAST_VERSION:-0.0.0}"
          echo "last_version=$LAST_VERSION" >> "$GITHUB_OUTPUT"

          # An "open" train is simply: does a vX.Y.Z-rc.* tag exist at all?
          # main's ruleset allows squash merges, so ancestry (is the rc tag a
          # commit reachable from main?) is not reliable -- a squash-merged
          # promotion never makes the original commit an ancestor of main.
          # Existence works instead because publish-release.yml deletes the
          # rc tag as its last step once the real vX.Y.Z tag lands on main,
          # so "tag exists" and "train open" stay in lockstep by construction.
          OPEN_TAG=$(git tag --list 'v*.*.*-rc.*' | sort -V | tail -n1)

          if [ -n "$OPEN_TAG" ]; then
            VERSION="${OPEN_TAG#v}"
            VERSION="${VERSION%-rc.*}"
            echo "mode=label" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Open train: $OPEN_TAG -- labeling PR into it, no new tag."
          else
            echo "mode=tag" >> "$GITHUB_OUTPUT"
            echo "No open train -- this PR opens a new one."
          fi

      # Lines-changed -> semver bump. Only fires when opening a NEW train;
      # once a train is open its version is fixed (see stage-tag.yml's
      # "label, not floating tag" design) -- later PRs in the same train
      # never change the version, however large their diff.
      - name: Determine bump level
        if: steps.train.outputs.mode == 'tag'
        id: bump
        env:
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
          LAST_VERSION: ${{ steps.train.outputs.last_version }}
        run: |
          set -euo pipefail
          TOTAL=$((ADDITIONS + DELETIONS))

          # The only two numbers that matter here. Tune if miscalibrated.
          MINOR_THRESHOLD=20
          MAJOR_THRESHOLD=200

          if [ "$TOTAL" -ge "$MAJOR_THRESHOLD" ]; then
            LEVEL=major
          elif [ "$TOTAL" -ge "$MINOR_THRESHOLD" ]; then
            LEVEL=minor
          else
            LEVEL=patch
          fi

          IFS=. read -r MAJOR MINOR PATCH <<< "$LAST_VERSION"
          case "$LEVEL" in
            major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
            minor) NEW_VERSION="$MAJOR.$((MINOR + 1)).0" ;;
            patch) NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
          esac

          echo "$TOTAL lines changed -> $LEVEL bump -> v$NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create staging tag
        if: steps.train.outputs.mode == 'tag'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="v${VERSION}-rc.1"
          git tag -a "$TAG" -m "Staging release train for v${VERSION} (opened by #${PR_NUMBER})"
          git push origin "refs/tags/$TAG"

      - name: Label PR into its release train
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VERSION: ${{ steps.train.outputs.mode == 'tag' && steps.bump.outputs.version || steps.train.outputs.version }}
        run: |
          set -euo pipefail
          LABEL="release:v${VERSION}"
          gh label create "$LABEL" --color BFD4F2 --description "Staged for v${VERSION}" 2>/dev/null || true
          gh pr edit "$PR_NUMBER" --add-label "$LABEL"
