[package]
name = "tauri-plugin-supabase-auth"
version = "0.10.0"
authors = ["Emmanuel De Freitas"]
description = "Supabase authentication plugin for Tauri v2 desktop apps"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/exegia/corpora-auth"
links = "tauri-plugin-supabase-auth"
# Workspace-only material: everything a consumer of the crate never needs.
# `make build:plugin` prints the resulting file list, so this stays honest.
exclude = [
  "/examples", "/ui", "/guest-js", "/node_modules", "/.github", "/assets",
  "/docs", "/specs", "/.specify", "/.claude", "/scripts", "/supabase",
  "/skills", "/skills-lock.json",
  "/Makefile", "/package.json", "/bun.lock", "/CLAUDE.md",
  "/.prettierrc", "/.prettierignore", "/.gitguardian.yaml",
]

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
supabase-lib-rs = { version = "0.5.3", default-features = false, features = ["auth", "native", "session-management"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
open = "5"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
tauri = { version = "2", features = ["test"] }

[lib]
name = "tauri_plugin_supabase_auth"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSWindow", "NSResponder"] }
objc2-authentication-services = "0.3.2"
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSData", "NSError", "NSArray", "NSProcessInfo", "NSDictionary", "NSValue"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Networking_WindowsWebServices", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader"] }
